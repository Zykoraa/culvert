name: Build signed Culvert release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: culvert-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      RestoreLockedMode: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Validate source, dependencies and behavior
        shell: pwsh
        run: |
          ./scripts/check-public-source.ps1
          ./scripts/check-secrets.ps1
          ./scripts/check-engines.ps1
          dotnet run --project tests/Culvert.Checks.csproj -c Release -p:OwnerBuild=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Import protected Culvert signing key
        env:
          SIGNING_KEY: ${{ secrets.CULVERT_SIGNING_KEY_PEM }}
        shell: pwsh
        run: |
          if (!$env:SIGNING_KEY) { throw 'Culvert release signing secret is missing.' }
          $key = Join-Path $env:RUNNER_TEMP 'culvert-release.pem'
          try {
            [IO.File]::WriteAllText($key, $env:SIGNING_KEY)
            dotnet run --project tools/ReleaseTool/ReleaseTool.csproj -c Release -- import $key
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -LiteralPath $key -Force -ErrorAction SilentlyContinue
            Remove-Item Env:SIGNING_KEY -ErrorAction SilentlyContinue
          }
      - name: Package both editions and verify installation
        shell: pwsh
        run: |
          ./scripts/package-client.ps1
          ./scripts/test-setup.ps1
          ./scripts/package-owner.ps1
          ./scripts/prepare-public-release.ps1
      - name: Publish versioned installers, bundles and feeds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Culvert.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ }
          $tag = 'v' + $version
          $assets = @(Get-ChildItem "artifacts/private/public-release/$version/assets" -File | Select-Object -ExpandProperty FullName)
          gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Culvert $version" --notes-file RELEASE_NOTES.md @assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remove runner signing material
        if: always()
        shell: pwsh
        run: |
          Remove-Item (Join-Path $env:LOCALAPPDATA 'CulvertSigning') -Recurse -Force -ErrorAction SilentlyContinue
