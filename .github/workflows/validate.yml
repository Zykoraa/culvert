name: Culvert release checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  RestoreLockedMode: 'true'
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test Linux control boundary and server operations
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 -m compileall -q linux
          bash -n linux/install.sh linux/install-system.sh server/bootstrap.sh
      - name: Verify and package Linux engines
        run: python3 linux/package.py
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Check public source and Git history
        shell: pwsh
        run: |
          ./scripts/check-public-source.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/check-secrets.ps1
      - name: Check engine pins
        shell: pwsh
        run: ./scripts/check-engines.ps1
      - name: Behavioral and disposable-machine network tests
        shell: pwsh
        run: |
          dotnet run --project tests/Culvert.Checks.csproj -c Release -p:OwnerBuild=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Culvert.Checks.csproj -c Release -p:OwnerBuild=false -- --native cores/sing_box/sing-box.exe
      - name: Build dashboard and installer
        shell: pwsh
        run: |
          dotnet build -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build installer/Culvert.Setup.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/UI/Culvert.UiChecks.csproj -c Release
      - name: Capture Culvert dashboard and check navigation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/private/preview | Out-Null
          $preview = Join-Path $PWD 'tests/UI/bin/Release/net10.0-windows/Culvert.UiChecks.dll'
          $snapshot = Join-Path $PWD 'artifacts/private/preview/Culvert-dashboard.png'
          $process = Start-Process dotnet -ArgumentList @(('"' + $preview + '"'), '--demo', '--interaction-checks', '--snapshot', ('"' + $snapshot + '"')) -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            Get-Content tests/UI/bin/Release/net10.0-windows/layout-check.txt -ErrorAction SilentlyContinue
            throw 'Dashboard navigation/layout checks failed.'
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: Culvert-preview
          path: artifacts/private/preview/
          if-no-files-found: warn
      - name: Test-signed blank installer and repair lifecycle
        shell: pwsh
        run: |
          # Ephemeral runner-only trust. The production private key never goes to CI.
          dotnet run --project tools/ReleaseTool/ReleaseTool.csproj -c Release -- init ReleaseTrust.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/package-client.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-setup.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/package-owner.ps1
